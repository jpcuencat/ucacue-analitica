name: LangSmith Evaluation

# Dispara cuando cambia el agente, las tools o los prompts.
# Manual (workflow_dispatch) para correr bajo demanda sin costo innecesario.
on:
  push:
    branches: [main, master]
    paths:
      - "src/agent/**"
      - "src/tools/**"
      - "src/evaluation/**"
      - "evaluate.py"
  workflow_dispatch:   # botón "Run workflow" en GitHub Actions

jobs:
  evaluate:
    name: Evaluación de calidad del agente
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar evaluación LangSmith
        run: python evaluate.py
        env:
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          UCACUE_API_KEY:        ${{ secrets.UCACUE_API_KEY }}
          UCACUE_API_URL:        ${{ secrets.UCACUE_API_URL }}
          LANGCHAIN_API_KEY:     ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2:  "true"
          LANGCHAIN_PROJECT:     ucacue-analitica
          MODEL_NAME:            ${{ secrets.MODEL_NAME }}
          JUDGE_MODEL_NAME:      gpt-5.4-mini
