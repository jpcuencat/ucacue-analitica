  /api/carreras:
    get:
      summary: Catálogo y resolución de carreras por nombre
      description: |
        Endpoint de catálogo y resolución de entidades de carrera. Devuelve
        carreras activas del modelo Power BI y permite convertir texto libre
        del usuario en una opción de carrera confirmable.

        Úselo antes de llamar endpoints analíticos cuando el usuario mencione
        una carrera por lenguaje natural, nombre incompleto, nombre con tildes
        omitidas o descripción aproximada. Ejemplos: "medicina", "medicina a",
        "derecho", "psicologia clinica", "veterinaria".

        No use textos aproximados directamente en `/api/estudiantes`,
        `/api/comparativo-periodo` o `/api/cohortes`. Primero resuelva la
        carrera en este endpoint, muestre las opciones al usuario y continúe
        solo cuando el usuario confirme la opción correcta.

        Flujo recomendado para una base vectorial o asistente:
        1. Si el usuario pide métricas de una carrera ambigua, llamar
           `/api/carreras?selector=true&buscar={texto_del_usuario}`.
        2. Presentar al usuario las opciones devueltas en `nombre_carrera`
           junto con `codigo_carrera` si ayuda a distinguirlas.
        3. Esperar confirmación del usuario.
        4. Usar `nombre_carrera` confirmado como `carrera_nombre` en
           `/api/estudiantes` o `/api/comparativo-periodo`.
        5. Usar `codigo_carrera` confirmado como `carrera` en `/api/cohortes`.

        Con `selector=true`, la respuesta se reduce a opciones limpias:
        `codigo_carrera`, `nombre_carrera` y `codigos_carrera`. Este modo es
        el recomendado para resolver entidades antes de una consulta analítica.
        Sin `selector=true`, devuelve la ficha completa de cada carrera con
        sede, unidad, facultad, inscritos y pagados.

        El parámetro `buscar` permite búsqueda flexible por nombre de carrera:
        ignora mayúsculas/minúsculas, tildes y espacios repetidos. Cuando se
        envía `buscar`, el servicio consulta un catálogo amplio antes de
        filtrar para evitar perder carreras por el orden de inscritos. Las
        coincidencias se ordenan por relevancia: exactas primero, luego las
        que empiezan con el texto buscado y al final coincidencias parciales.

        Ejemplo: `buscar=medicina` debe priorizar `MEDICINA`, luego
        `MEDICINA A` o `MEDICINA VETERINARIA`, y después nombres que solo
        contienen la palabra, como `CAPACITACION PREUNIVERSITARIA MEDICINA`.

        `codigos_carrera` puede contener varios códigos internos para un
        mismo `nombre_carrera`. Por eso, para KPIs agregados normalmente es
        más estable usar `nombre_carrera`; para cohortes se requiere
        `codigo_carrera` porque ese endpoint filtra por código.

        El API no expone parámetro `top`; devuelve el catálogo disponible hasta
        el límite técnico interno del servicio.

        El filtro de periodo (`?periodo=`) convierte el código `AAAAN` a
        `AÑO_1` + `TIPO_CICLO` para filtrar las medidas `[Total_Inscritos]`
        y `[Total_Pagos]` al periodo académico indicado. Sin este filtro
        las medidas reflejan el acumulado de todos los periodos.

        En Swagger las opciones visibles se traducen así:
        `Sierra - 2026` = `20261`, `Costa - 2026` = `20252`,
        `Sierra - 2025` = `20251`, `Costa - 2025` = `20242`,
        `Sierra - 2024` = `20241`, `Costa - 2024` = `20232`.

        - SIERRA (`N=1`): `AÑO_1 = AAAA`
        - COSTA  (`N=2`): `AÑO_1 = AAAA + 1`
      operationId: getCarreras
      tags: [Dimensiones]
      parameters:
        - name: periodo
          in: query
          description: Periodo académico.
          required: false
          schema:
            type: string
            enum:
              - "Todos"
              - "Sierra - 2026"
              - "Costa - 2026"
              - "Sierra - 2025"
              - "Costa - 2025"
              - "Sierra - 2024"
              - "Costa - 2024"
            default: "Sierra - 2026"
        - name: sede
          in: query
          description: Sede universitaria.
          required: false
          schema:
            type: string
            enum:
              - "Todos"
              - "MATRIZ CUENCA"
              - "SEDE AZOGUES"
              - "SEDE MACAS"
              - "EXTENSION SAN PABLO DE LA TRONCAL"
              - "EXTENSION CAÑAR"
            default: "MATRIZ CUENCA"
        - name: facultad
          in: query
          description: Facultad (`CARRERAFACULTAD`).
          required: false
          schema:
            type: string
            enum:
              - "Todos"
              - "FACULTAD DE CIENCIAS AGROPECUARIAS"
              - "FACULTAD DE CIENCIAS DE LA SALUD"
              - "FACULTAD DE CIENCIAS ECONÓMICAS Y EMPRESARIALES"
              - "FACULTAD DE CIENCIAS SOCIALES"
              - "FACULTAD DE CRIMINOLOGÍA Y CIENCIAS FORENSES"
              - "FACULTAD DE EDUCACIÓN"
              - "FACULTAD DE FORMACIÓN TÉCNICA Y TECNOLÓGICA SUPERIOR"
              - "FACULTAD DE INFORMÁTICA, CIENCIAS DE LA COMPUTACIÓN, E INNOVACIÓN TECNOLÓGICA"
              - "FACULTAD DE INGENIERÍA, INDUSTRIA Y CONSTRUCCIÓN"
              - "UNIDAD DE CAPACITACION DE CIENCIAS MEDICAS"
            default: "FACULTAD DE CIENCIAS SOCIALES"
        - name: selector
          in: query
          description: Si es `true`, devuelve opciones simplificadas para confirmar carrera con el usuario antes de consultar endpoints analíticos.
          required: false
          schema:
            type: boolean
            default: false
        - name: buscar
          in: query
          description: Texto libre para buscar carreras por nombre. Ignora mayúsculas, tildes y espacios repetidos; prioriza coincidencias exactas. Recomendado con `selector=true` para obtener opciones y confirmar `nombre_carrera` o `codigo_carrera` con el usuario.
          required: false
          allowEmptyValue: true
          schema:
            type: string
            example: "medicina"
      responses:
        '200':
          description: Lista de carreras con totales.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  total:
                    type: integer
                  filtros:
                    type: object
                    properties:
                      periodo:
                        type: string
                        nullable: true
                      ano_academico:
                        type: integer
                        nullable: true
                      tipo_ciclo:
                        type: string
                        nullable: true
                        enum: [SIERRA, COSTA]
                      sede:
                        type: string
                        nullable: true
                      facultad:
                        type: string
                        nullable: true
                      selector:
                        type: boolean
                      buscar:
                        type: string
                        nullable: true
                        description: Texto de búsqueda aplicado; `null` significa sin búsqueda por nombre.
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/CarreraRow'
                        - $ref: '#/components/schemas/CarreraSelectorRow'
              examples:
                completo:
                  summary: Respuesta completa con métricas
                  value:
                    ok: true
                    total: 1
                    filtros:
                      periodo: "20261"
                      ano_academico: 2026
                      tipo_ciclo: SIERRA
                      sede: "MATRIZ CUENCA"
                      facultad: "FACULTAD DE CIENCIAS SOCIALES"
                      selector: false
                      buscar: null
                    data:
                      - CARRERAID: "PSI"
                        CARRERANOMBRE: "PSICOLOGÍA CLÍNICA"
                        CARRERASEDE: "MATRIZ CUENCA"
                        CARRERAUNIDAD: "UNIDAD ACADÉMICA DE CIENCIAS SOCIALES"
                        CARRERAFACULTAD: "FACULTAD DE CIENCIAS SOCIALES"
                        inscritos: 145
                        pagados: 138
                selector:
                  summary: Respuesta para selector de carreras
                  value:
                    ok: true
                    total: 1
                    filtros:
                      periodo: "20261"
                      ano_academico: 2026
                      tipo_ciclo: SIERRA
                      sede: "MATRIZ CUENCA"
                      facultad: "FACULTAD DE CIENCIAS SOCIALES"
                      selector: true
                      buscar: "dere"
                    data:
                      - codigo_carrera: "23101"
                        nombre_carrera: "DERECHO"
                        codigos_carrera: ["23101", "23111"]
                resolverMedicina:
                  summary: Resolución de una búsqueda ambigua
                  description: Use estas opciones para pedir confirmación antes de llamar `/api/estudiantes`, `/api/comparativo-periodo` o `/api/cohortes`.
                  value:
                    ok: true
                    total: 4
                    filtros:
                      periodo: "20261"
                      ano_academico: 2026
                      tipo_ciclo: SIERRA
                      sede: null
                      facultad: null
                      selector: true
                      buscar: "medicina"
                    data:
                      - codigo_carrera: "17001"
                        nombre_carrera: "MEDICINA"
                        codigos_carrera: ["17001"]
                      - codigo_carrera: "17002"
                        nombre_carrera: "MEDICINA A"
                        codigos_carrera: ["17002"]
                      - codigo_carrera: "23801"
                        nombre_carrera: "MEDICINA VETERINARIA"
                        codigos_carrera: ["23801"]
                      - codigo_carrera: "16901"
                        nombre_carrera: "CAPACITACION PREUNIVERSITARIA MEDICINA"
                        codigos_carrera: ["16901"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/periodos:
    get:
      summary: Lista de periodos académicos con fechas clave
      description: |
        Devuelve todos los periodos del calendario académico ordenados
        por `PERIODONUMERICO` DESC. Útil para poblar selectores de periodo.
        TTL de caché: 1 hora (los periodos cambian poco).
      operationId: getPeriodos
      tags: [Dimensiones]
      parameters:
        - $ref: '#/components/parameters/ciclo'
        - $ref: '#/components/parameters/ano'
      responses:
        '200':
          description: Lista de periodos académicos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  filtros:
                    type: object
                    properties:
                      ano:
                        type: string
                        nullable: true
                      ciclo:
                        type: string
                        nullable: true
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PeriodoRow'
              example:
                ok: true
                filtros:
                  ano: "2026"
                  ciclo: "SIERRA"
                total: 1
                data:
                  - periodo: "20261"
                    inicio_periodo: "2026-04-01T00:00:00Z"
                    fin_periodo: "2026-09-30T00:00:00Z"
                    inscripciones_inicio: "2026-01-15T00:00:00Z"
                    inscripciones_fin: "2026-03-31T00:00:00Z"
                    matricula_inicio: "2026-03-01T00:00:00Z"
                    matricula_fin: "2026-04-15T00:00:00Z"
                    inicio_clases: "2026-04-07T00:00:00Z"
                    fin_clases: "2026-09-26T00:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/sedes:
    get:
      summary: Lista de sedes universitarias con totales
      description: |
        Devuelve todas las sedes con inscritos, pagados y número de carreras
        activas, ordenadas por inscritos DESC.
        Sin parámetros — siempre devuelve todas las sedes.
        TTL de caché: 1 hora.
      operationId: getSedes
      tags: [Dimensiones]
      responses:
        '200':
          description: Lista de sedes con totales.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  total:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SedeRow'
              example:
                ok: true
                total: 4
                data:
                  - carrerasede: "MATRIZ CUENCA"
                    inscritos: 3820
                    pagados: 3540
                    carreras: 28
                  - carrerasede: "SEDE AZOGUES"
                    inscritos: 640
                    pagados: 590
                    carreras: 8
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/cache/invalidate:
    post:
      summary: Invalidar caché de un dominio
      description: |
        Fuerza la invalidación del caché en memoria para el prefijo indicado.
        Útil cuando se actualiza el dataset en Power BI Service y se necesita
        que la API devuelva datos frescos sin esperar el TTL natural.

        El prefijo `"all"` invalida toda la caché.
      operationId: invalidateCache
      tags: [Administración]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prefix]
              properties:
                prefix:
                  type: string
                  enum:
                    - estudiantes
                    - marketing
                    - carreras
                    - matriculas-carrera
                    - periodos
                    - sedes
                    - facultades
                    - historico
                    - all
                  example: estudiantes
            example:
              prefix: estudiantes
      responses:
        '200':
          description: Caché invalidado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
              example:
                ok: true
                message: "Caché invalidado para: estudiantes"
                timestamp: "2026-06-05T14:30:00.000Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/cohortes:
    get:
      summary: Análisis de permanencia y deserción por cohortes
      description: |
        Devuelve la matriz longitudinal de retención estudiantil y el resumen
        por cohorte (NRO. INICIAL, NRO. ACTUAL, TASA DE PÉRDIDA).

        Equivale al visual "Análisis de Permanencia y Deserción: Diagnóstico
        por Cohortes" del dashboard de Power BI.

        **Cálculo:**
        - `nro_inicial` = estudiantes del cohorte en su primer periodo
        - `nro_actual` = estudiantes del cohorte en el periodo más reciente
        - `tasa_perdida` = (nro_actual − nro_inicial) / nro_inicial

        **Medida**: usa `[DistinctDocs_SinHomologación]` del modelo Power BI,
        que internamente aplica los filtros del visual:
        `RETIRADO = 0`, `CONVALIDACION = 0`, `MODOMATRICULA` regular,
        `FECHAPAGO` no nulo, `CICLO` no nulo.

        Si el usuario menciona una carrera por texto aproximado, primero use
        `/api/carreras?selector=true&buscar={texto}` para obtener opciones,
        confirme la carrera correcta con el usuario y luego envíe el
        `codigo_carrera` confirmado en el parámetro `carrera`.
      operationId: getCohortes
      tags: [Cohortes]
      parameters:
        - name: carrera
          in: query
          description: Código exacto de carrera (`CARRERAID`). Sin este filtro devuelve todos los cohortes institucionales. Para texto aproximado, primero use `/api/carreras?selector=true&buscar={texto}`, confirme la opción con el usuario y luego envíe el `codigo_carrera`.
          required: false
          schema:
            type: string
            example: "24001"
        - name: sede
          in: query
          description: Sede universitaria. `Todos` = todas las sedes.
          required: false
          schema:
            type: string
            enum:
              - "Todos"
              - "MATRIZ CUENCA"
              - "SEDE AZOGUES"
              - "SEDE MACAS"
              - "EXTENSION SAN PABLO DE LA TRONCAL"
              - "EXTENSION CAÑAR"
            default: "Todos"
        - name: facultad
          in: query
          description: Facultad. `Todos` = todas las facultades.
          required: false
          schema:
            type: string
            enum:
              - "Todos"
              - "FACULTAD DE CIENCIAS AGROPECUARIAS"
              - "FACULTAD DE CIENCIAS DE LA SALUD"
              - "FACULTAD DE CIENCIAS ECONÓMICAS Y EMPRESARIALES"
              - "FACULTAD DE CIENCIAS SOCIALES"
              - "FACULTAD DE CRIMINOLOGÍA Y CIENCIAS FORENSES"
              - "FACULTAD DE EDUCACIÓN"
              - "FACULTAD DE FORMACIÓN TÉCNICA Y TECNOLÓGICA SUPERIOR"
              - "FACULTAD DE INFORMÁTICA, CIENCIAS DE LA COMPUTACIÓN, E INNOVACIÓN TECNOLÓGICA"
              - "FACULTAD DE INGENIERÍA, INDUSTRIA Y CONSTRUCCIÓN"
              - "UNIDAD DE CAPACITACION DE CIENCIAS MEDICAS"
            default: "Todos"
        - name: modalidad
          in: query
          description: |
            Modalidad académica. Swagger muestra el nombre y el API lo convierte internamente al código `MODALIDADID`.
          required: false
          schema:
            $ref: '#/components/schemas/ModalidadId'
        - name: cohorte
          in: query
          description: Cohorte mínimo a incluir — `COHORTENUMERICO >= valor`. Formato `AAAAN`.
          required: false
          schema:
            type: string
            pattern: '^\d{5}$'
            example: "20221"
        - name: hasta_periodo
          in: query
          description: Periodo máximo a incluir — `PERIODONUMERICO <= valor`. Acotar aquí el periodo actual evita incluir periodos futuros con datos incompletos. Formato `AAAAN`.
          required: false
          schema:
            type: string
            pattern: '^\d{5}$'
            example: "20252"
      responses:
        '200':
          description: Análisis de cohortes calculado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  filtros:
                    type: object
                    properties:
                      carrera:
                        type: string
                        nullable: true
                      sede:
                        type: string
                        nullable: true
                      facultad:
                        type: string
                        nullable: true
                      modalidad:
                        type: string
                        nullable: true
                      cohorte:
                        type: string
                        nullable: true
                      hasta_periodo:
                        type: string
                        nullable: true
                  periodo_actual:
                    type: string
                    description: Periodo más reciente con datos (usado para calcular nro_actual).
                    example: "20252"
                  total_cohortes:
                    type: integer
                  resumen:
                    type: array
                    description: Un elemento por cohorte, ordenado por cohorte DESC.
                    items:
                      $ref: '#/components/schemas/CohorteResumenRow'
                  matriz:
                    type: array
                    description: Tabla cruzada plana (PERIODO × COHORTE → estudiantes).
                    items:
                      $ref: '#/components/schemas/CohorteMatrizRow'
              example:
                ok: true
                filtros:
                  carrera: "24001"
                  sede: null
                  facultad: null
                  modalidad: "P"
                  cohorte: null
                  hasta_periodo: null
                periodo_actual: "20252"
                total_cohortes: 2
                resumen:
                  - cohorte: 20252
                    nro_inicial: 45
                    nro_actual: 45
                    tasa_perdida: 0
                  - cohorte: 20251
                    nro_inicial: 37
                    nro_actual: 31
                    tasa_perdida: -0.162
                matriz:
                  - periodo: "20252"
                    cohorte: 20252
                    estudiantes: 45
                  - periodo: "20251"
                    cohorte: 20251
                    estudiantes: 37
                  - periodo: "20252"
                    cohorte: 20251
                    estudiantes: 31
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/BadGateway'

tags:
  - name: KPIs
    description: |
      Indicadores clave del Resumen Ejecutivo de Gestión: inscritos, reservas,
      matrículas, repetidores, convalidados, pagos pendientes, conversión y pérdida.
  - name: Matrícula
    description: Desglose de matrícula por carrera y tipo de estudiante.
  - name: Histórico
    description: Series temporales de inscripciones y matrículas.
  - name: Cohortes
    description: Análisis longitudinal de permanencia y deserción por cohortes.
  - name: Dimensiones
    description: Catálogos para poblar selectores (sedes, facultades, carreras, periodos).
  - name: Administración
    description: Operaciones de mantenimiento de la API.