<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente Analítica UCACUE</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── Página de demo ─────────────────────────────────────────── */
    .page-header {
      background: #AB0000;
      color: #fff;
      padding: 16px 32px;
    }

    .page-header__logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .page-header__subtitle {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 2px;
    }

    .page-content {
      max-width: 860px;
      margin: 48px auto;
      padding: 0 24px;
    }

    .page-content h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .page-content p {
      font-size: 15px;
      line-height: 1.7;
      color: #444;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      background: #1976D2;
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .card ul {
      padding-left: 20px;
      font-size: 14px;
      color: #555;
      line-height: 1.8;
    }

    /* ── Widget flotante ────────────────────────────────────────── */
    #widget-wrapper {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    #widget-window {
      width: 460px;
      height: 650px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.22);
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      display: none;
    }

    #widget-window.open {
      display: block;
    }

    #widget-window iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #widget-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #AB0000;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(171, 0, 0, 0.4);
      color: #fff;
      font-size: 22px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    #widget-btn:hover {
      transform: scale(1.07);
      box-shadow: 0 6px 20px rgba(171, 0, 0, 0.5);
    }

    #widget-label {
      background: #1a1a2e;
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 20px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      pointer-events: none;
      transition: opacity 0.3s;
    }

    #widget-label.hidden {
      opacity: 0;
    }

    @media (max-width: 480px) {
      #widget-window {
        width: calc(100vw - 16px);
        height: 70vh;
      }

      #widget-wrapper {
        bottom: 16px;
        right: 16px;
      }
    }
  </style>
</head>

<body>

  <header class="page-header">
    <div class="page-header__logo">UCACUE</div>
    <div class="page-header__subtitle">Universidad Católica de Cuenca</div>
  </header>

  <!-- <main class="page-content">
    <h1>Analítica Académica</h1>
      <span class="badge"></span>
    <div class="card">
    </div>
    <div class="card">
    </div> 
  </main> -->

  <!-- Widget flotante -->
  <div id="widget-wrapper">
    <span id="widget-label">Asistente Analítica</span>
    <div id="widget-window"></div>
    <button id="widget-btn" aria-label="Abrir asistente de analítica">💬</button>
  </div>

  <script>
    (function () {
      var WIDGET_URL = window.location.origin + "/?widget=true";
      var btn = document.getElementById("widget-btn");
      var win = document.getElementById("widget-window");
      var label = document.getElementById("widget-label");
      var loaded = false;
      var isOpen = false;

      function openWidget() {
        if (!loaded) {
          var iframe = document.createElement("iframe");
          iframe.src = WIDGET_URL;
          iframe.title = "Asistente de Analítica Académica UCACUE";
          win.appendChild(iframe);
          loaded = true;
        }
        win.classList.add("open");
        btn.innerHTML = "✕";
        btn.setAttribute("aria-label", "Cerrar asistente");
        label.classList.add("hidden");
        isOpen = true;
        try { sessionStorage.setItem("ucacue_widget_open", "1"); } catch (e) { }
      }

      function closeWidget() {
        win.classList.remove("open");
        btn.innerHTML = "💬";
        btn.setAttribute("aria-label", "Abrir asistente de analítica");
        label.classList.remove("hidden");
        isOpen = false;
        try { sessionStorage.removeItem("ucacue_widget_open"); } catch (e) { }
      }

      btn.addEventListener("click", function () {
        if (isOpen) { closeWidget(); } else { openWidget(); }
      });

      // Re-open the widget when the chat signals it has loaded after a login redirect.
      window.addEventListener("message", function (e) {
        if (e.origin !== window.location.origin) return;
        if (e.data && e.data.type === "ucacue-widget-ready" && !isOpen) {
          openWidget();
        }
      });

      // Auto-open if the widget was open before a page reload.
      try {
        if (sessionStorage.getItem("ucacue_widget_open") === "1") {
          openWidget();
        }
      } catch (e) { }

      // Ocultar label automáticamente tras 4 s
      setTimeout(function () { label.classList.add("hidden"); }, 4000);
    })();
  </script>

</body>

</html>
